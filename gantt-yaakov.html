<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח גאנט שנתי — ריכוז חברתי | אורט בית הערבה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1565C0;
  --primary-light: #E3F2FD;
  --primary-dark: #0D47A1;
  --green: #2E7D32;
  --green-light: #E8F5E9;
  --orange: #E65100;
  --orange-light: #FFF3E0;
  --purple: #6A1B9A;
  --purple-light: #F3E5F5;
  --red: #C62828;
  --red-light: #FFEBEE;
  --teal: #00695C;
  --teal-light: #E0F2F1;
  --pink: #AD1457;
  --pink-light: #FCE4EC;
  --amber: #F57F17;
  --amber-light: #FFF8E1;
  --gray-50: #FAFAFA;
  --gray-100: #F5F5F5;
  --gray-200: #EEEEEE;
  --gray-300: #E0E0E0;
  --gray-400: #BDBDBD;
  --gray-600: #757575;
  --gray-800: #424242;
  --gray-900: #212121;
  --radius: 12px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 20px rgba(0,0,0,0.12);
}

body {
  font-family: 'Heebo', sans-serif;
  background: var(--gray-100);
  color: var(--gray-900);
  min-height: 100vh;
}

/* Header */
.header {
  background: white;
  border-bottom: 1px solid var(--gray-200);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
  flex-wrap: wrap;
  gap: 12px;
}

.header-right { display: flex; align-items: center; gap: 16px; }

.header h1 { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
.header .subtitle { font-size: 0.8rem; color: var(--gray-600); }

.user-badge {
  background: var(--primary-light);
  color: var(--primary);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 500;
}

/* Controls bar */
.controls {
  padding: 16px 24px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  background: white;
  border-bottom: 1px solid var(--gray-200);
}

.year-select {
  padding: 8px 16px;
  border: 2px solid var(--primary);
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--primary);
  background: var(--primary-light);
  cursor: pointer;
  outline: none;
}

.category-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex: 1;
}

.cat-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--gray-300);
  background: white;
  font-family: inherit;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.cat-btn:hover { border-color: var(--primary); }
.cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

.cat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.btn-add {
  padding: 8px 18px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
}

.btn-add:hover { background: var(--primary-dark); }

.btn-export {
  padding: 8px 14px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.85rem;
  cursor: pointer;
}

/* Gantt Container */
.gantt-wrapper {
  padding: 16px 24px;
  overflow-x: auto;
}

.gantt-container {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  min-width: 1200px;
  overflow: hidden;
}

/* Month headers */
.month-header {
  display: grid;
  grid-template-columns: 260px repeat(12, 1fr);
  border-bottom: 2px solid var(--gray-200);
  position: sticky;
  top: 0;
  z-index: 10;
  background: white;
}

.month-header .label-col {
  padding: 12px 16px;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--gray-600);
  background: var(--gray-50);
  border-left: 1px solid var(--gray-200);
}

.month-header .month-col {
  padding: 10px 4px;
  text-align: center;
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--gray-800);
  border-left: 1px solid var(--gray-200);
  position: relative;
}

.month-col.current {
  background: var(--primary-light);
  color: var(--primary);
}

/* Gantt rows */
.gantt-row {
  display: grid;
  grid-template-columns: 260px repeat(12, 1fr);
  border-bottom: 1px solid var(--gray-200);
  min-height: 48px;
  align-items: center;
  transition: background 0.15s;
}

.gantt-row:hover { background: var(--gray-50); }

.gantt-row:last-child { border-bottom: none; }

.row-label {
  padding: 10px 16px;
  border-left: 1px solid var(--gray-200);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.85rem;
}

.row-label .cat-indicator {
  width: 4px;
  height: 28px;
  border-radius: 2px;
  flex-shrink: 0;
}

.row-label .event-name {
  font-weight: 600;
  line-height: 1.3;
}

.row-label .event-sub {
  font-size: 0.75rem;
  color: var(--gray-600);
}

.row-label .actions {
  margin-right: auto;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.2s;
}

.gantt-row:hover .actions { opacity: 1; }

.action-sm {
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 4px;
  font-size: 0.75rem;
  color: var(--gray-600);
}

.action-sm:hover { background: var(--gray-200); }

.month-cell {
  border-left: 1px solid var(--gray-200);
  height: 100%;
  position: relative;
  min-height: 48px;
}

/* Bars */
.bar {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  height: 26px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: 500;
  color: white;
  cursor: pointer;
  transition: filter 0.2s;
  z-index: 5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 6px;
}

.bar:hover { filter: brightness(1.15); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

/* Single-day event marker */
.marker {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 3px solid;
  background: white;
  z-index: 6;
  cursor: pointer;
}

.marker:hover { transform: translate(-50%, -50%) scale(1.3); }

/* Category separator */
.category-header {
  display: grid;
  grid-template-columns: 260px repeat(12, 1fr);
  background: var(--gray-50);
  border-bottom: 1px solid var(--gray-200);
}

.category-header .cat-title {
  padding: 8px 16px;
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--gray-600);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Today line */
.today-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--red);
  z-index: 8;
  pointer-events: none;
}

.today-line::before {
  content: 'היום';
  position: absolute;
  top: -18px;
  right: -14px;
  font-size: 0.65rem;
  color: var(--red);
  font-weight: 700;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal-overlay.show { display: flex; }

.modal {
  background: white;
  border-radius: var(--radius);
  padding: 28px;
  width: 90%;
  max-width: 480px;
  box-shadow: var(--shadow-lg);
  max-height: 90vh;
  overflow-y: auto;
}

.modal h2 { margin-bottom: 20px; font-size: 1.2rem; color: var(--primary); }

.form-group { margin-bottom: 14px; }

.form-group label {
  display: block;
  margin-bottom: 5px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--gray-600);
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--gray-300);
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.form-group input:focus,
.form-group select:focus { border-color: var(--primary); }

.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

.modal-actions { display: flex; gap: 10px; margin-top: 20px; }

.btn-save {
  flex: 1;
  padding: 10px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
}

.btn-cancel {
  padding: 10px 20px;
  background: var(--gray-100);
  color: var(--gray-800);
  border: 1px solid var(--gray-300);
  border-radius: 8px;
  font-family: inherit;
  cursor: pointer;
}

.btn-delete {
  padding: 10px 16px;
  background: var(--red-light);
  color: var(--red);
  border: 1px solid #FFCDD2;
  border-radius: 8px;
  font-family: inherit;
  cursor: pointer;
  font-size: 0.85rem;
}

/* Summary bar */
.summary-bar {
  padding: 12px 24px;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 0.85rem;
  color: var(--gray-600);
}

.summary-item { display: flex; align-items: center; gap: 6px; }
.summary-dot { width: 10px; height: 10px; border-radius: 50%; }

/* Print */
@media print {
  .header { position: static; }
  .controls, .btn-add, .btn-export, .actions { display: none !important; }
  body { background: white; }
  .gantt-container { box-shadow: none; border: 1px solid #ddd; }
  .gantt-wrapper { padding: 0; overflow: visible; }
  .gantt-container { min-width: unset; }
}

@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .controls { padding: 12px 16px; }
  .gantt-wrapper { padding: 12px 16px; }
  .header h1 { font-size: 1.1rem; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-right">
    <div>
      <h1>לוח גאנט שנתי — ריכוז חברתי</h1>
      <div class="subtitle">תיכון אורט בית הערבה</div>
    </div>
  </div>
  <div class="user-badge">רכז חברתי: יעקב</div>
</header>

<div class="controls">
  <select class="year-select" id="year-select" onchange="switchYear()">
    <option value="tashpaz">תשפ"ז (2026-2027)</option>
    <option value="tashpach">תשפ"ח (2027-2028)</option>
  </select>

  <div class="category-filters" id="cat-filters"></div>

  <button class="btn-add" onclick="openModal()">+ הוספה</button>
  <button class="btn-export" onclick="exportPrint()">🖨️ הדפסה</button>
</div>

<div class="summary-bar" id="summary-bar"></div>

<div class="gantt-wrapper">
  <div class="gantt-container" id="gantt"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">הוספת פריט חדש</h2>
    <div class="form-group">
      <label>שם הפריט</label>
      <input type="text" id="input-name" placeholder="למשל: יום השואה, שבוע חינוך חברתי...">
    </div>
    <div class="form-group">
      <label>קטגוריה</label>
      <select id="input-category"></select>
    </div>
    <div class="form-group">
      <label>סוג</label>
      <select id="input-type">
        <option value="bar">תקופה (בר)</option>
        <option value="marker">אירוע יחיד (נקודה)</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>תאריך התחלה</label>
        <input type="date" id="input-start">
      </div>
      <div class="form-group" id="end-group">
        <label>תאריך סיום</label>
        <input type="date" id="input-end">
      </div>
    </div>
    <div class="form-group">
      <label>הערות (אופציונלי)</label>
      <textarea id="input-notes" rows="2" placeholder="פרטים נוספים..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-save" onclick="saveItem()">שמירה</button>
      <button class="btn-delete" id="btn-delete" style="display:none" onclick="deleteItem()">מחיקה</button>
      <button class="btn-cancel" onclick="closeModal()">ביטול</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'gantt_yaakov_chevrati';

const CATEGORIES = [
  { id: 'memorial', name: 'ימי זיכרון וטקסים', color: '#C62828', icon: '🕯️' },
  { id: 'social', name: 'חינוך חברתי', color: '#1565C0', icon: '🤝' },
  { id: 'volunteering', name: 'התנדבות ומעורבות', color: '#2E7D32', icon: '💚' },
  { id: 'events', name: 'אירועים ופעילויות', color: '#6A1B9A', icon: '🎉' },
  { id: 'trips', name: 'טיולים וסיורים', color: '#E65100', icon: '🚌' },
  { id: 'councils', name: 'מועצת תלמידים', color: '#00695C', icon: '🏛️' },
  { id: 'prevention', name: 'מניעה ובריאות', color: '#AD1457', icon: '🛡️' },
  { id: 'programs', name: 'תוכניות עבודה', color: '#F57F17', icon: '📋' },
];

const HEBREW_MONTHS_TASHPAZ = [
  { name: 'ספט׳', key: '2026-09' },
  { name: 'אוק׳', key: '2026-10' },
  { name: 'נוב׳', key: '2026-11' },
  { name: 'דצמ׳', key: '2026-12' },
  { name: 'ינו׳', key: '2027-01' },
  { name: 'פבר׳', key: '2027-02' },
  { name: 'מרץ', key: '2027-03' },
  { name: 'אפר׳', key: '2027-04' },
  { name: 'מאי', key: '2027-05' },
  { name: 'יוני', key: '2027-06' },
  { name: 'יולי', key: '2027-07' },
  { name: 'אוג׳', key: '2027-08' },
];

const HEBREW_MONTHS_TASHPACH = [
  { name: 'ספט׳', key: '2027-09' },
  { name: 'אוק׳', key: '2027-10' },
  { name: 'נוב׳', key: '2027-11' },
  { name: 'דצמ׳', key: '2027-12' },
  { name: 'ינו׳', key: '2028-01' },
  { name: 'פבר׳', key: '2028-02' },
  { name: 'מרץ', key: '2028-03' },
  { name: 'אפר׳', key: '2028-04' },
  { name: 'מאי', key: '2028-05' },
  { name: 'יוני', key: '2028-06' },
  { name: 'יולי', key: '2028-07' },
  { name: 'אוג׳', key: '2028-08' },
];

const SAMPLE_TASHPAZ = [
  { id: 1, name: 'פתיחת שנה — ערב היכרות', cat: 'events', type: 'marker', start: '2026-09-01', end: '', notes: 'ערב היכרות שכבתי' },
  { id: 2, name: 'בחירות למועצת תלמידים', cat: 'councils', type: 'bar', start: '2026-09-15', end: '2026-10-01', notes: '' },
  { id: 3, name: 'שבוע גיבוש כיתתי', cat: 'social', type: 'bar', start: '2026-10-05', end: '2026-10-09', notes: 'פעילויות גיבוש לכל הכיתות' },
  { id: 4, name: 'יום המורה', cat: 'events', type: 'marker', start: '2026-11-24', end: '', notes: '' },
  { id: 5, name: 'שבוע התנדבות בקהילה', cat: 'volunteering', type: 'bar', start: '2026-11-16', end: '2026-11-20', notes: 'שיתוף עם עיריית ערד' },
  { id: 6, name: 'יום המאבק באלימות נגד נשים', cat: 'prevention', type: 'marker', start: '2026-11-25', end: '', notes: '' },
  { id: 7, name: 'חנוכה — שוק ופעילויות', cat: 'events', type: 'bar', start: '2026-12-15', end: '2026-12-22', notes: '' },
  { id: 8, name: 'יום שידור נגד גזענות', cat: 'prevention', type: 'marker', start: '2027-01-18', end: '', notes: '' },
  { id: 9, name: 'טו בשבט — נטיעות', cat: 'volunteering', type: 'marker', start: '2027-02-01', end: '', notes: 'נטיעות עם קק"ל' },
  { id: 10, name: 'שבוע ספר', cat: 'social', type: 'bar', start: '2027-02-15', end: '2027-02-19', notes: '' },
  { id: 11, name: 'פורים — תחפושות ופעילויות', cat: 'events', type: 'marker', start: '2027-03-14', end: '', notes: '' },
  { id: 12, name: 'תוכנית מניעת סמים ואלכוהול', cat: 'prevention', type: 'bar', start: '2027-03-01', end: '2027-03-31', notes: 'סדנאות שכבתיות' },
  { id: 13, name: 'יום השואה והגבורה', cat: 'memorial', type: 'marker', start: '2027-04-07', end: '', notes: 'טקס + עדויות' },
  { id: 14, name: 'יום הזיכרון לחללי צה"ל', cat: 'memorial', type: 'marker', start: '2027-04-14', end: '', notes: 'טקס בית ספרי' },
  { id: 15, name: 'יום העצמאות', cat: 'events', type: 'marker', start: '2027-04-15', end: '', notes: 'חגיגה בית ספרית' },
  { id: 16, name: 'שבוע מועצת תלמידים ארצי', cat: 'councils', type: 'bar', start: '2027-04-20', end: '2027-04-24', notes: '' },
  { id: 17, name: 'טיול שנתי — שכבת י׳', cat: 'trips', type: 'bar', start: '2027-05-04', end: '2027-05-06', notes: '3 ימים בצפון' },
  { id: 18, name: 'טיול שנתי — שכבת יא׳', cat: 'trips', type: 'bar', start: '2027-05-11', end: '2027-05-13', notes: '3 ימים בדרום' },
  { id: 19, name: 'יום ירושלים', cat: 'memorial', type: 'marker', start: '2027-05-18', end: '', notes: '' },
  { id: 20, name: 'סיכום שנה + מסיבת סיום', cat: 'events', type: 'bar', start: '2027-06-15', end: '2027-06-25', notes: 'טקסי סיום + חלוקת תעודות' },
  { id: 21, name: 'תוכנית מנהיגות — שכבת י׳', cat: 'programs', type: 'bar', start: '2026-10-01', end: '2027-05-30', notes: 'מפגשים דו-שבועיים' },
  { id: 22, name: 'תוכנית מנהיגות — שכבת יא׳', cat: 'programs', type: 'bar', start: '2026-10-01', end: '2027-05-30', notes: 'מפגשים דו-שבועיים' },
  { id: 23, name: 'ליווי התנדבות שוטפת', cat: 'volunteering', type: 'bar', start: '2026-09-15', end: '2027-06-15', notes: 'בתי אבות, קהילה' },
  { id: 24, name: 'ישיבות מועצת תלמידים', cat: 'councils', type: 'bar', start: '2026-10-01', end: '2027-06-15', notes: 'כל שבועיים ביום ג׳' },
  { id: 25, name: 'יום המשפחה', cat: 'social', type: 'marker', start: '2027-02-14', end: '', notes: 'פעילות שכבתית' },
  { id: 26, name: 'ל"ג בעומר — על האש', cat: 'events', type: 'marker', start: '2027-05-09', end: '', notes: '' },
];

let currentYear = 'tashpaz';
let activeCategories = new Set(CATEGORIES.map(c => c.id));
let editingId = null;

function getMonths() {
  return currentYear === 'tashpaz' ? HEBREW_MONTHS_TASHPAZ : HEBREW_MONTHS_TASHPACH;
}

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) return JSON.parse(saved);
  const initial = { tashpaz: SAMPLE_TASHPAZ, tashpach: [] };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
  return initial;
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let allData = loadData();

function getData() {
  return allData[currentYear] || [];
}

function setData(items) {
  allData[currentYear] = items;
  saveData(allData);
}

// Build category filters
function buildFilters() {
  const container = document.getElementById('cat-filters');
  container.innerHTML = CATEGORIES.map(c => `
    <button class="cat-btn ${activeCategories.has(c.id) ? 'active' : ''}" data-cat="${c.id}" onclick="toggleCategory('${c.id}')">
      <span class="cat-dot" style="background:${c.color}"></span>
      ${c.icon} ${c.name}
    </button>
  `).join('');
}

function toggleCategory(id) {
  if (activeCategories.has(id)) activeCategories.delete(id);
  else activeCategories.add(id);
  buildFilters();
  render();
}

function switchYear() {
  currentYear = document.getElementById('year-select').value;
  render();
}

// Render Gantt
function render() {
  const months = getMonths();
  const data = getData().filter(item => activeCategories.has(item.cat));
  const gantt = document.getElementById('gantt');

  // Group by category
  const grouped = {};
  CATEGORIES.forEach(c => { grouped[c.id] = []; });
  data.forEach(item => {
    if (grouped[item.cat]) grouped[item.cat].push(item);
  });

  // Find current month
  const now = new Date();
  const currentMonthKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

  let html = '';

  // Month header
  html += '<div class="month-header">';
  html += '<div class="label-col">פריט</div>';
  months.forEach(m => {
    html += `<div class="month-col ${m.key === currentMonthKey ? 'current' : ''}">${m.name}</div>`;
  });
  html += '</div>';

  html += '<div style="position:relative">';

  // Rows by category
  CATEGORIES.forEach(cat => {
    if (!activeCategories.has(cat.id)) return;
    const items = grouped[cat.id];
    if (items.length === 0) return;

    html += `<div class="category-header"><div class="cat-title"><span class="cat-dot" style="background:${cat.color};width:10px;height:10px;border-radius:50%;display:inline-block"></span>${cat.icon} ${cat.name}</div></div>`;

    items.forEach(item => {
      html += `<div class="gantt-row">`;
      html += `<div class="row-label">
        <div class="cat-indicator" style="background:${cat.color}"></div>
        <div>
          <div class="event-name">${item.name}</div>
          ${item.notes ? `<div class="event-sub">${item.notes}</div>` : ''}
        </div>
        <div class="actions">
          <button class="action-sm" onclick="editItem(${item.id})" title="עריכה">✏️</button>
          <button class="action-sm" onclick="removeItem(${item.id})" title="מחיקה">🗑️</button>
        </div>
      </div>`;

      months.forEach((m, mi) => {
        html += `<div class="month-cell" data-month="${mi}">`;

        if (item.type === 'marker') {
          const markerMonth = item.start.substring(0, 7);
          if (markerMonth === m.key) {
            const day = parseInt(item.start.substring(8, 10));
            const pct = (day / 30) * 100;
            html += `<div class="marker" style="right:${pct}%;border-color:${cat.color}" title="${item.name} — ${formatDate(item.start)}" onclick="editItem(${item.id})"></div>`;
          }
        } else if (item.type === 'bar') {
          const startMonth = item.start.substring(0, 7);
          const endMonth = item.end.substring(0, 7);
          const startMi = months.findIndex(mm => mm.key === startMonth);
          const endMi = months.findIndex(mm => mm.key === endMonth);

          if (mi >= startMi && mi <= endMi && startMi !== -1 && endMi !== -1) {
            if (mi === startMi) {
              const startDay = parseInt(item.start.substring(8, 10));
              const endDay = (startMi === endMi) ? parseInt(item.end.substring(8, 10)) : 30;
              const rightPct = ((startDay - 1) / 30) * 100;
              const widthPct = ((endDay - startDay + 1) / 30) * 100;

              if (startMi === endMi) {
                html += `<div class="bar" style="right:${rightPct}%;width:${widthPct}%;background:${cat.color}" title="${item.name}" onclick="editItem(${item.id})">${item.name}</div>`;
              } else {
                html += `<div class="bar" style="right:${rightPct}%;width:${100 - rightPct}%;background:${cat.color};border-radius:6px 0 0 6px" title="${item.name}" onclick="editItem(${item.id})">${item.name}</div>`;
              }
            } else if (mi === endMi) {
              const endDay = parseInt(item.end.substring(8, 10));
              const widthPct = (endDay / 30) * 100;
              html += `<div class="bar" style="right:0;width:${widthPct}%;background:${cat.color};border-radius:0 6px 6px 0" onclick="editItem(${item.id})"></div>`;
            } else {
              html += `<div class="bar" style="right:0;width:100%;background:${cat.color};border-radius:0" onclick="editItem(${item.id})"></div>`;
            }
          }
        }

        html += '</div>';
      });

      html += '</div>';
    });
  });

  html += '</div>';
  gantt.innerHTML = html;

  // Summary
  const allItems = getData();
  const summaryHtml = CATEGORIES.map(c => {
    const count = allItems.filter(i => i.cat === c.id).length;
    if (count === 0) return '';
    return `<div class="summary-item"><span class="summary-dot" style="background:${c.color}"></span>${c.name}: ${count}</div>`;
  }).filter(Boolean).join('');
  document.getElementById('summary-bar').innerHTML = `<div class="summary-item"><strong>סה"כ: ${allItems.length} פריטים</strong></div>` + summaryHtml;
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('he-IL', { day: 'numeric', month: 'short' });
}

// Modal
function openModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'הוספת פריט חדש';
  document.getElementById('input-name').value = '';
  document.getElementById('input-notes').value = '';
  document.getElementById('input-start').value = '';
  document.getElementById('input-end').value = '';
  document.getElementById('input-type').value = 'bar';
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('end-group').style.display = '';
  populateCategorySelect();
  document.getElementById('modal-overlay').classList.add('show');
}

function editItem(id) {
  const items = getData();
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'עריכת פריט';
  document.getElementById('input-name').value = item.name;
  document.getElementById('input-notes').value = item.notes || '';
  document.getElementById('input-start').value = item.start;
  document.getElementById('input-end').value = item.end || '';
  document.getElementById('input-type').value = item.type;
  document.getElementById('btn-delete').style.display = '';
  document.getElementById('end-group').style.display = item.type === 'marker' ? 'none' : '';
  populateCategorySelect(item.cat);
  document.getElementById('modal-overlay').classList.add('show');
}

function populateCategorySelect(selected) {
  const sel = document.getElementById('input-category');
  sel.innerHTML = CATEGORIES.map(c => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${c.icon} ${c.name}</option>`).join('');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function saveItem() {
  const name = document.getElementById('input-name').value.trim();
  const cat = document.getElementById('input-category').value;
  const type = document.getElementById('input-type').value;
  const start = document.getElementById('input-start').value;
  const end = document.getElementById('input-end').value;
  const notes = document.getElementById('input-notes').value.trim();

  if (!name || !start) { alert('יש למלא שם ותאריך התחלה'); return; }
  if (type === 'bar' && !end) { alert('יש למלא תאריך סיום לתקופה'); return; }

  const items = getData();

  if (editingId) {
    const item = items.find(i => i.id === editingId);
    Object.assign(item, { name, cat, type, start, end: type === 'marker' ? '' : end, notes });
  } else {
    const newId = items.length ? Math.max(...items.map(i => i.id)) + 1 : 1;
    items.push({ id: newId, name, cat, type, start, end: type === 'marker' ? '' : end, notes });
  }

  setData(items);
  closeModal();
  render();
}

function deleteItem() {
  if (!editingId) return;
  if (!confirm('למחוק את הפריט?')) return;
  const items = getData().filter(i => i.id !== editingId);
  setData(items);
  closeModal();
  render();
}

function removeItem(id) {
  if (!confirm('למחוק?')) return;
  const items = getData().filter(i => i.id !== id);
  setData(items);
  render();
}

function exportPrint() { window.print(); }

// Type toggle
document.getElementById('input-type').addEventListener('change', function() {
  document.getElementById('end-group').style.display = this.value === 'marker' ? 'none' : '';
});

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Init
buildFilters();
render();
</script>
</body>
